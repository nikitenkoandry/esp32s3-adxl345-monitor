<text x='928' y='998' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='400' text-anchor='start' fill='#17568D'>SPI: mode 3, 2 MHz  |  ADXL345: nominal 800 Hz</text>
<text x='80' y='1060' font-family='Segoe UI,Arial,sans-serif' font-size='22' font-weight='400' text-anchor='start' fill='#526375'>Terminal positions are schematic. Follow the printed pin labels on your boards.</text>
<text x='80' y='1093' font-family='Segoe UI,Arial,sans-serif' font-size='20' font-weight='400' text-anchor='start' fill='#526375'>SDA / SDI is MOSI in SPI mode; SDO is MISO. INT1 must connect to GPIO4.</text>
</svg>
