<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
<title id="title">ADXL345 to ESP32-S3 SPI wiring</title>
<desc id="description">VCC to 3V3, GND to GND, SCLK to GPIO12, SDA or SDI to GPIO11, SDO to GPIO13, CS to GPIO10, and INT1 to GPIO4. Use the USB-UART connector to the PC at 921600 baud. Terminal positions are schematic.</desc>
